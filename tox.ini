[tox]
minversion = 4.0
envlist =
    unit
    tekton
    ruff
    ruff-format
    yamllint
    bandit
    hadolint
skip_missing_interpreters = true

labels =
    static = ruff,ruff-format,yamllint,bandit,hadolint
    test = unit,tekton

[testenv]
description =
    unit: Run unit tests
    tekton: Run Tekton task YAML tests
skip_install = true
deps =
    pytest>=7.4
    pytest-mock>=3.12
    pyyaml>=6.0
    tenacity
commands =
    unit: pytest tests/unit/
    tekton: pytest tests/tekton/

[testenv:ruff]
description = Lint Python code with ruff
skip_install = true
deps =
    ruff>=0.4
commands =
    ruff check task tests

[testenv:ruff-format]
description = Check Python code formatting with ruff
skip_install = true
deps =
    ruff>=0.4
commands =
    ruff format --check task tests

[testenv:yamllint]
description = Lint YAML files with yamllint
skip_install = true
deps =
    yamllint>=1.35
commands =
    yamllint .github task

[testenv:bandit]
description = Scan Python code for common security issues
skip_install = true
deps =
    bandit>=1.9
commands =
    bandit -ll -r task tests -s B101,B103,B108,B404,B603,B607,B608 -x .tox,.git

[testenv:hadolint]
description = Lint container build file with hadolint
skip_install = true
deps =
    hadolint-py==2.15.1.2
commands =
    hadolint --failure-threshold error Containerfile.iib-build-task
